<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRC Sync - Lyrics to LRC</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --field: #0f3460;
            --field-border: #2a4a7a;
            --accent: #e94560;
            --accent-hover: #c73454;
            --text: #eee;
            --muted: #a8b2d1;
            --danger: #ff6b81;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::selection { background: var(--accent); color: #fff; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2.5rem 1.25rem 3rem;
            line-height: 1.5;
        }
        .container { max-width: 860px; margin: 0 auto; }
        header { text-align: center; margin: 0.5rem 0 1.75rem; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); margin-bottom: 0.35rem; }
        .subtitle { color: var(--muted); font-size: 1rem; max-width: 60ch; margin: 0 auto; }
        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        .card h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: -0.01em; }
        label { display: block; margin-bottom: 0.45rem; font-weight: 600; font-size: 0.9rem; }
        .hint { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
        input[type="file"],
        input[type="text"],
        input[type="url"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid var(--field-border);
            border-radius: 8px;
            background: var(--field);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
        }
        input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.85; }
        input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        textarea { min-height: 190px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.6; }
        input[type="file"] { padding: 0.55rem 0.7rem; }
        input[type="file"]::file-selector-button {
            background: var(--field-border);
            color: var(--text);
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            margin-right: 0.75rem;
            font: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .row > div { flex: 1; min-width: 0; }
        .row:last-child { margin-bottom: 0; }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            font-family: inherit;
            transition: background-color 180ms ease-out, transform 180ms ease-out;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: translateY(1px); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        .result { display: none; }
        .result pre {
            background: var(--field);
            border: 1px solid var(--field-border);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88rem;
            line-height: 1.65;
            max-height: 320px;
            overflow-y: auto;
            font-variant-numeric: tabular-nums;
        }
        .download-btn { background: var(--field); border: 1px solid var(--field-border); margin-top: 0.75rem; }
        .download-btn:hover { background: #1a4a7a; }
        #cancelBtn:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
        #retryBtn { margin-top: 0.5rem; }
        .divider { border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 1.25rem 0; }
        .status { text-align: center; color: var(--muted); margin-top: 0.75rem; min-height: 1.4em; font-size: 0.92rem; }
        .error { color: var(--danger); text-align: center; margin-top: 0.75rem; min-height: 1.4em; font-size: 0.92rem; }
        #progressWrap { margin-top: 1rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
        .tab { width: auto; padding: 0.45rem 1.1rem; background: var(--field); border: 1px solid var(--field-border); font-weight: 600; }
        .tab.active { background: var(--accent); border-color: var(--accent); }
        #tabAdvancedPanel .row > div > label { cursor: help; }
        #tabAdvancedPanel .row > div { padding: 0.25rem 0; }
        .tip-wrap { position: relative; }
        .tip { cursor: help; color: var(--muted); display: inline-block; position: relative; }
        .tip:hover::after {
            content: attr(data-tip);
            position: absolute;
            left: 0; top: 1.6em;
            max-width: 280px;
            width: max-content;
            background: #0f3460;
            border: 1px solid var(--field-border);
            color: var(--text);
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.45;
            white-space: normal;
            z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
        }
        input[type="range"] { width: 100%; accent-color: var(--accent); background: transparent; border: none; padding: 0; height: 2.2rem; }
        .track {
            background: var(--field);
            border: 1px solid var(--field-border);
            border-radius: 8px;
            height: 20px;
            overflow: hidden;
        }
        #progressFill { background: var(--accent); height: 100%; width: 0%; transition: none; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--field-border); border-radius: 8px; border: 3px solid var(--bg); }
        @media (max-width: 640px) {
            body { padding: 1.5rem 0.9rem 2.5rem; }
            .row { flex-direction: column; }
            h1 { font-size: 1.7rem; }
            .card { padding: 1.1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LRC Sync</h1>
            <p class="subtitle">Sync your lyrics with audio to create LRC files</p>
        </header>

        <div class="card">
            <div class="tabs">
                <button id="tabMain" class="tab active" onclick="showTab('main')">Main</button>
                <button id="tabAdvanced" class="tab" onclick="showTab('advanced')">Advanced</button>
            </div>
            <div id="tabMainPanel">
            <div class="row">
                <div>
                    <label for="audio">Audio File</label>
                    <input type="file" id="audio" accept="audio/*">
                </div>
                <div>
                    <label for="model">Model</label>
                    <select id="model">
                        <option value="tiny">Tiny (fastest, least accurate)</option>
                        <option value="base">Base</option>
                        <option value="small" selected>Small (recommended)</option>
                        <option value="medium">Medium</option>
                        <option value="large-v3">Large v3 (slowest, most accurate)</option>
                        <option value="large-v3-turbo">Turbo (large-v3, fast + accurate)</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="youtubeUrl">Or YouTube URL</label>
                    <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="" selected>Auto-detect</option>
                        <option value="en">English</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ko">Korean</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="th">Thai</option>
                        <option value="vi">Vietnamese</option>
                        <option value="id">Indonesian</option>
                        <option value="ms">Malay</option>
                        <option value="tr">Turkish</option>
                        <option value="pl">Polish</option>
                        <option value="nl">Dutch</option>
                        <option value="uk">Ukrainian</option>
                    </select>
                </div>
                <div>
                    <label for="offset">Offset <span class="hint">(seconds)</span></label>
                    <input type="number" id="offset" value="0" step="0.1">
                </div>
            </div>
            <label for="lyrics">Lyrics <span class="hint">(one line per lyric line)</span></label>
            <textarea id="lyrics" placeholder="Enter your lyrics here...&#10;One line per lyric line"></textarea>
            </div>
            <div id="tabAdvancedPanel" style="display:none;">
                <div class="row">
                    <div class="tip-wrap">
                        <label for="temperature">Temperature <span class="hint" id="temperatureVal">0.0</span> <span class="tip" data-tip="Sampling temperature: 0 = deterministic and safest for lyrics. Raise toward 1.0 only for more varied transcription; higher values risk more mistakes.">ⓘ</span></label>
                        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0" oninput="document.getElementById('temperatureVal').textContent=this.value">
                    </div>
                    <div class="tip-wrap">
                        <label for="beamSize">Beam size <span class="hint" id="beamSizeVal">5</span> <span class="tip" data-tip="Beam size: wider beam search = more accurate but slower. 5 is a good default; try 3 for speed or 8-10 for the slowest, most careful result.">ⓘ</span></label>
                        <input type="range" id="beamSize" min="1" max="10" step="1" value="5" oninput="document.getElementById('beamSizeVal').textContent=this.value">
                    </div>
                </div>
                <div class="row">
                    <div class="tip-wrap">
                        <label for="bestOf">Best of <span class="hint" id="bestOfVal">5</span> <span class="tip" data-tip="Best of: number of candidates sampled before picking the best result. Pairs with temperature; raise both only for hard tracks, at the cost of speed.">ⓘ</span></label>
                        <input type="range" id="bestOf" min="1" max="10" step="1" value="5" oninput="document.getElementById('bestOfVal').textContent=this.value">
                    </div>
                    <div></div>
                </div>
            </div>
            <br><br>
            <button id="alignBtn" onclick="align()">Generate LRC</button>
            <button id="cancelBtn" class="download-btn" style="display:none; margin-top:0.5rem;" onclick="cancelJob()">Cancel</button>
            <div id="progressWrap" style="display:none;">
                <div class="track">
                    <div id="progressFill"></div>
                </div>
                <div id="progressLabel" class="status"></div>
            </div>
            <div id="status" class="status" role="status"></div>
            <div id="error" class="error" role="alert"></div>
        </div>

        <div class="card result" id="resultCard">
            <h2>Result</h2>
            <pre id="result"></pre>
            <button class="download-btn" onclick="downloadLRC()">Download .lrc</button>
            <button id="wordsBtn" class="download-btn" onclick="downloadWords()">Download words.json</button>
            <button id="syncBtn" class="download-btn" onclick="downloadSync()">Download output_sync.json</button>
            <div class="divider"></div>
            <h2>Publish to LRCLIB</h2>
            <div class="row">
                <div>
                    <label for="trackName">Song name</label>
                    <input type="text" id="trackName" placeholder="Track title">
                </div>
                <div>
                    <label for="artistName">Artist</label>
                    <input type="text" id="artistName" placeholder="Artist name">
                </div>
            </div>
            <div class="row">
                <div>
                    <label for="duration">Duration (seconds)</label>
                    <input type="number" id="duration" placeholder="e.g. 215" min="1" step="1">
                </div>
                <div>
                    <label for="albumName">Album (optional)</label>
                    <input type="text" id="albumName" placeholder="Album name">
                </div>
            </div>
            <button id="publishBtn" onclick="publishToLrclib()">Upload to LRCLIB</button>
            <button id="retryBtn" class="download-btn" style="display:none;" onclick="retryLookup()">Check again for ID</button>
            <div id="publishStatus" class="status" role="status"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
